{% extends "base.html" %}
{% block titulo %}Registrar pedido — Plataforma LGPD{% endblock %}
{% block conteudo %}
<div class="page-head">
  <a class="link-voltar" href="{{ url_for('direitos.listar') }}">Voltar aos direitos</a>
  <h1>Registrar pedido do titular</h1>
</div>
<div class="card">
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="campo"><span>Nome do titular</span><input type="text" name="nome_titular" required></label>
    <label class="campo"><span>Contato (e-mail/telefone)</span><input type="text" name="contato"></label>
    <label class="campo">
      <span>Tipo de pedido</span>
      <select name="tipo" required>
        {% for code, label in tipos %}<option value="{{ code }}">{{ label }}</option>{% endfor %}
      </select>
    </label>
    <label class="campo"><span>Descrição</span><textarea name="descricao" rows="3"></textarea></label>
    <p class="muted">O prazo de atendimento será definido em 15 dias a partir de hoje.</p>
    <button class="btn btn-primary" type="submit">Registrar</button>
  </form>
</div>
{% endblock %}
