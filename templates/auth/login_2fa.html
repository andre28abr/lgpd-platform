{% extends "base.html" %}
{% block titulo %}Verificação em duas etapas — Plataforma LGPD{% endblock %}
{% block conteudo %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-head">
      <span class="brand-mark brand-mark-lg">LGPD</span>
      <h1>Verificação em duas etapas</h1>
      <p class="muted">Digite o código de 6 dígitos do app autenticador — ou um código de recuperação.</p>
    </div>
    <form method="post" action="{{ url_for('auth.login_2fa', next=request.args.get('next')) }}" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="campo">
        <span>Código</span>
        <input type="text" name="codigo" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9 ]*" maxlength="9" required autofocus>
      </label>
      <button class="btn btn-primary btn-bloco" type="submit">Verificar</button>
    </form>
    <p class="muted" style="margin-top:1rem; text-align:center;"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
  </div>
</div>
{% endblock %}
