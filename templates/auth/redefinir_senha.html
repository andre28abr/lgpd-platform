{% extends "base.html" %}
{% block titulo %}Redefinir senha — Plataforma LGPD{% endblock %}
{% block conteudo %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-head">
      <span class="brand-mark brand-mark-lg">LGPD</span>
      <h1>Redefinir senha</h1>
      <p class="muted">Escolha uma nova senha (mínimo de 8 caracteres, não apenas números).</p>
    </div>

    <form method="post" action="{{ url_for('auth.redefinir_senha', token=token) }}" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="campo">
        <span>Nova senha</span>
        <input type="password" name="senha" autocomplete="new-password" required autofocus>
      </label>
      <label class="campo">
        <span>Confirme a nova senha</span>
        <input type="password" name="confirmacao" autocomplete="new-password" required>
      </label>
      <button class="btn btn-primary btn-bloco" type="submit">Salvar nova senha</button>
    </form>
  </div>
</div>
{% endblock %}
