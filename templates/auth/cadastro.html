{% extends "base.html" %}
{% block titulo %}Criar conta — Plataforma LGPD{% endblock %}
{% block conteudo %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-head">
      <span class="brand-mark brand-mark-lg">LGPD</span>
      <h1>Criar conta da empresa</h1>
      <p class="muted">Você será o Encarregado (DPO) e poderá cadastrar setores e colaboradores.</p>
    </div>

    <form method="post" action="{{ url_for('auth.cadastro') }}" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="campo"><span>Nome da empresa</span><input type="text" name="empresa" required autofocus></label>
      <label class="campo"><span>Seu nome</span><input type="text" name="nome" required></label>
      <label class="campo"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="campo"><span>Senha (mín. 8 caracteres)</span><input type="password" name="senha" autocomplete="new-password" minlength="8" required></label>
      <button class="btn btn-primary btn-bloco" type="submit">Criar conta</button>
    </form>

    <p class="muted" style="margin-top:1rem;">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
  </div>
</div>
{% endblock %}
