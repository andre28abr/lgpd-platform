{% extends "base.html" %}
{% block titulo %}Esqueci minha senha — Plataforma LGPD{% endblock %}
{% block conteudo %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-head">
      <span class="brand-mark brand-mark-lg">LGPD</span>
      <h1>Esqueci minha senha</h1>
      <p class="muted">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para redefinir a senha.</p>
    </div>

    <form method="post" action="{{ url_for('auth.esqueci_senha') }}" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="campo">
        <span>E-mail</span>
        <input type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <button class="btn btn-primary btn-bloco" type="submit">Enviar link</button>
    </form>

    <p class="muted" style="margin-top:1rem; text-align:center;"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
  </div>
</div>
{% endblock %}
