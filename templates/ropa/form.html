{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if reg else 'Novo' }} registro ROPA — Plataforma LGPD{% endblock %}
{% block conteudo %}
<div class="page-head">
  <a class="link-voltar" href="{{ url_for('ropa.listar') }}">Voltar ao ROPA</a>
  <h1>{{ 'Editar registro' if reg else 'Novo registro' }}</h1>
</div>
<div class="card">
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="campo"><span>Atividade de tratamento</span><input type="text" name="atividade" value="{{ reg.atividade if reg else '' }}" required></label>
    <div class="form-row">
      <label class="campo">
        <span>Setor</span>
        <select name="setor_id">
          <option value="">Toda a empresa</option>
          {% for s in setores %}<option value="{{ s.id }}" {% if reg and reg.setor_id == s.id %}selected{% endif %}>{{ s.nome }}</option>{% endfor %}
        </select>
      </label>
      <label class="campo">
        <span>Base legal</span>
        <select name="base_legal">
          <option value="">— selecione —</option>
          {% for code, label in bases %}<option value="{{ code }}" {% if reg and reg.base_legal == code %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </label>
    </div>
    <label class="campo"><span>Titulares (de quem são os dados)</span><input type="text" name="titulares" value="{{ reg.titulares if reg else '' }}" placeholder="ex.: colaboradores, clientes"></label>
    <label class="campo"><span>Categorias de dados</span><textarea name="categorias_dados" rows="2">{{ reg.categorias_dados if reg else '' }}</textarea></label>
    <label class="campo"><span>Finalidade</span><textarea name="finalidade" rows="2">{{ reg.finalidade if reg else '' }}</textarea></label>
    <label class="campo"><span>Retenção</span><input type="text" name="retencao" value="{{ reg.retencao if reg else '' }}" placeholder="ex.: durante o contrato + prazo legal"></label>
    <label class="campo"><span>Compartilhamento</span><textarea name="compartilhamento" rows="2">{{ reg.compartilhamento if reg else '' }}</textarea></label>
    <button class="btn btn-primary" type="submit">Salvar registro</button>
  </form>
</div>
{% endblock %}
