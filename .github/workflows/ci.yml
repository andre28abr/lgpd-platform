name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  audit:
    name: Vulnerabilidades (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Falha se alguma dependência pinada tiver CVE conhecido. Para uma exceção
      # consciente, use: pip-audit --ignore-vuln <ID>.
      - run: pip-audit -r requirements.txt

  test:
    name: Testes (SQLite, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Rodar testes com cobertura mínima
        run: pytest -q --cov=. --cov-report=term --cov-fail-under=85

  test-postgres:
    name: Migrações + testes (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lgpd
          POSTGRES_PASSWORD: lgpd
          POSTGRES_DB: lgpd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lgpd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FLASK_APP: app
      LGPD_SKIP_DOTENV: "1"
      SECRET_KEY: chave-de-ci-nao-usar-em-producao
      DATABASE_URL: postgresql://lgpd:lgpd@localhost:5432/lgpd
      LGPD_TEST_DATABASE_URL: postgresql://lgpd:lgpd@localhost:5432/lgpd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      # O mesmo caminho do entrypoint do Docker: as migrações precisam aplicar
      # limpas num Postgres real (foi aqui que um DEFAULT 0 em coluna booleana
      # derrubava o container e ninguém via, porque o CI só rodava SQLite).
      - name: Aplicar migrações (upgrade → downgrade → upgrade)
        run: |
          flask db upgrade
          flask db downgrade base
          flask db upgrade
      - name: Rodar a suíte contra o PostgreSQL
        run: pytest -q
